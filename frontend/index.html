<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Desk</title>
    <script>
      // Runs before first paint so there's no flash of the wrong theme. Mirrors
      // ThemeProvider's own resolution logic (src/lib/theme.tsx) — kept in sync
      // by hand since this has to run before any module script loads.
      (function () {
        try {
          var t = window.localStorage.getItem('currencydesk.theme.v1')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
